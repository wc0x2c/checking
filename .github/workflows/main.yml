name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install the toolchain of rust-toolchain.toml
        run: rustup show

      - uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-nextest

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: just quick-test

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain of rust-toolchain.toml
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Check the format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      # The iRacing sender compiles only for Windows. The C parts of some
      # dependencies need the mingw compiler.
      - name: Install mingw
        run: sudo apt-get update && sudo apt-get install --yes gcc-mingw-w64-x86-64
      - name: Lint for Windows
        run: cargo clippy --target x86_64-pc-windows-gnu --all-targets -- -D warnings

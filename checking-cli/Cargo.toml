[package]
name = "checking-cli"
description = "GUI for iRacing fuel strategy"
readme = "../README.md"
version.workspace = true
authors.workspace = true
license.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories = ["games", "gui"]
include = ["src/**", "LICENSE-*"]

[[bin]]
name = "checking"
path = "src/main.rs"
bench = false

[dependencies]
checking-protocol = { path = "../crates/checking-protocol", version = "0.1.0" }
checking-fuel = { path = "../crates/checking-fuel", version = "0.1.0" }
checking-iracingio = { path = "../crates/checking-iracingio", version = "0.1.0" }
eframe = "0.30"
egui = "0.30"
egui_plot = "0.30"
egui_extras = { version = "0.30" }
tokio = { workspace = true }
tokio-util = { workspace = true }
anyhow = { workspace = true }
deku = { workspace = true }
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "5.0"

[dev-dependencies]
proptest = "1"
